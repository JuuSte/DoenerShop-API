
spring.application.name=donershop

spring.datasource.url=jdbc:h2:mem:sbipdb

# H2 Drive class
spring.datasource.driverClassName=org.h2.Driver

# Database Username
spring.datasource.username=sa

# Database Password
spring.datasource.password=password

#Enable H2 console
spring.h2.console.enabled=true

server.port = 5000
# H2 Datenbank dauerhaft speichern
spring.datasource.url=jdbc:h2:file:./data/donershop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tabellen automatisch erstellen und aktualisieren
spring.jpa.hibernate.ddl-auto=update

# H2 Konsole
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080
